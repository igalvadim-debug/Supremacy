<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f19">
<title>Remote Supremacy</title>
<style>
  :root { --bg:#0b0f19; --panel:#131a2b; --line:#2a3a5c; --text:#eaf0fb; --muted:#8f9bb5; --accent:#35c4ff; --accent2:#7a6cff; --ok:#5ee19a; --err:#ff7b8b; }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--text); font-family: Roboto,"Segoe UI",Arial,sans-serif; -webkit-tap-highlight-color: transparent; }
  header { position: sticky; top:0; z-index:5; background: rgba(11,15,25,.97); padding:.7rem .9rem; border-bottom:1px solid var(--line); }
  .now { font-weight:800; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now small { color: var(--muted); font-weight:400; }
  .row { display:flex; gap:.5rem; margin-top:.55rem; align-items:center; }
  button { height:2.6rem; min-width:3rem; padding:0 1rem; border:0; border-radius:.6rem; color:#fff; font-weight:700; cursor:pointer; background: linear-gradient(135deg,var(--accent),var(--accent2)); font-size:1.1rem; }
  button.p { background:#243254; }
  input { flex:1; height:2.6rem; padding:0 .8rem; border-radius:.6rem; border:1px solid var(--line); background:#0a1120; color:var(--text); font-size:1rem; }
  select { height:2.6rem; border-radius:.6rem; border:1px solid var(--line); background:#0a1120; color:var(--text); flex:1; min-width:0; }
  #pin { flex:0 0 4rem; width:4rem; padding:0 .2rem; text-align:center; letter-spacing:.2rem; }
input[type=checkbox] { width:1.6rem; height:1.6rem; flex:0 0 auto; }
  details { margin:.2rem .9rem; }
  summary { cursor:pointer; color:var(--muted); padding:.35rem 0; font-weight:600; }
  .filebtn { display:inline-flex; align-items:center; height:2.6rem; padding:0 1rem; border-radius:.6rem; background:#243254; font-weight:700; cursor:pointer; }
  #groups { display:flex; gap:.4rem; overflow-x:auto; padding:.6rem .9rem; -webkit-overflow-scrolling:touch; }
  #groups::-webkit-scrollbar { height:.3rem; }
  .chip { flex:0 0 auto; padding:.4rem .85rem; border-radius:1rem; background:var(--panel); border:1px solid transparent; font-size:.85rem; cursor:pointer; white-space:nowrap; }
  .chip.a { background: linear-gradient(135deg,var(--accent),var(--accent2)); font-weight:700; }
  #list { padding:.2rem .9rem 3rem; }
  .it { display:flex; align-items:center; gap:.6rem; padding:.7rem .85rem; margin-bottom:.4rem; background:var(--panel); border:1px solid var(--line); border-radius:.6rem; cursor:pointer; }
  .it.on { border-color: var(--ok); }
  .it .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .it button.mini { min-width:2.2rem; height:2.2rem; padding:0 .5rem; font-size:.9rem; background:#2a3550; }
  .it button.mini.fav { color:#ffd24d; }
  .it button.mini.fav.on { background:#7a5c00; }
  .it button.mini.del { background:#3a2631; }
  .status { padding:.5rem .9rem; color: var(--muted); font-size:.88rem; }
  .err { color: var(--err); }
</style>
</head>
<body>
<header>
  <div class="now" id="now">Соединение…</div>
  <div class="row">
    <button class="p" id="sync" style="flex:1">&#8635; Синхронизация с плеером</button>
  </div>
  <div class="row">
    <button class="p" id="prev" aria-label="Предыдущий">&#8249;</button>
    <button class="p" id="next" aria-label="Следующий">&#8250;</button>
    <input id="q" placeholder="Поиск канала…" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
</header>
<details id="pl">
  <summary>Плейлист и EPG</summary>
  <div class="row"><input id="plurl" placeholder="Ссылка на плейлист M3U…" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="plload">Загрузить</button></div>
  <div class="row"><input id="epgurl" placeholder="Ссылка на EPG (xml / xml.gz)…" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="epgload">EPG</button></div>  <div class="row"><button class="p" id="pldl">⬇ Скачать текущий</button><label class="filebtn">Импорт файла<input id="plup" type="file" accept=".m3u,.m3u8" hidden></label></div>
  <div class="row"><button class="p" id="plsave">&#128190; Сохранить в файл</button><button id="plreset">&#8617; Сбросить правки</button></div>
  <div class="status" id="plmsg"></div>
</details>
<details id="grp">
  <summary>Группы и родительский PIN</summary>
  <div class="row"><input id="pin" placeholder="PIN" inputmode="numeric" maxlength="3" autocomplete="off"><button id="pinset">Задать PIN</button><button class="p" id="pinunlock">Показать скрытые</button></div>
  <div class="row"><span class="status" style="flex:0 0 auto">Merge</span><select id="mtarget"></select><button id="mmerge">Объединить</button></div>
  <div id="glist"></div>
  <div class="status" id="gmsg"></div>
</details>
<div id="groups"></div>
<div id="list"><div class="status">Загрузка…</div></div>
<div class="status err" id="err"></div>
<script src="js/remote.js"></script>
</body>
</html>
